<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cuentas Misteriosas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;600;700&family=Special+Elite&display=swap">
<style>
/* Concepto: papel de libro contable (renglones verdes), tinta azul para el Debe y tinta roja para el Haber,
   notas amarillas con letra de máquina de escribir como pistas y sello violeta de "RESUELTO". */
:root{
  --paper:#E4EDE6; --line:rgba(20,40,58,.10); --sheet:#F6F9F4; --ink:#14283A; --ink-soft:#4A5F6F; --rule:#A9BDB0;
  --debe:#1B4F9C; --haber:#A32A2A; --on-color:#FFFFFF; --stamp:#5B2A86; --ok:#1B7A4A; --bad:#C2561A;
  --slip:#F7E9A6; --slip-ink:#3B3310; --slip-edge:#D9C566;
  --f-disp:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-type:"Special Elite","Courier New",Courier,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1A23; --line:rgba(160,200,220,.07); --sheet:#162631; --ink:#E4EDE7; --ink-soft:#9DB2C0; --rule:#2C4352;
  --debe:#7FB1FF; --haber:#FF8F87; --on-color:#0E1A23; --stamp:#C9A0F2; --ok:#5ED39A; --bad:#FFA765;
  --slip:#3A3517; --slip-ink:#F3E7B0; --slip-edge:#5C5426; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1A23; --line:rgba(160,200,220,.07); --sheet:#162631; --ink:#E4EDE7; --ink-soft:#9DB2C0; --rule:#2C4352;
  --debe:#7FB1FF; --haber:#FF8F87; --on-color:#0E1A23; --stamp:#C9A0F2; --ok:#5ED39A; --bad:#FFA765;
  --slip:#3A3517; --slip-ink:#F3E7B0; --slip-edge:#5C5426; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);padding:10px 0 8px;margin-bottom:18px}
.hud-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.hud-cell{display:flex;flex-direction:column;min-width:0}
.hud-cell.center{align-items:center}.hud-cell.right{align-items:flex-end}
.hud .k{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.hud .v{font:700 18px var(--f-mono);font-variant-numeric:tabular-nums}
.hud .v.big{font-size:30px;line-height:1.1}
.hud .v.low{color:var(--bad);animation:blink 1s steps(2,start) infinite}
.bar{height:5px;background:var(--rule);margin-top:8px}.bar i{display:block;height:100%;background:var(--ink);width:100%;transition:width 1s linear}
.dots{display:flex;gap:6px;margin-top:8px}
.dot{flex:1;height:8px;border:2px solid var(--ink);background:transparent}
.dot.done{background:var(--stamp);border-color:var(--stamp)}
.dot.cur{background:var(--ink)}

/* Textos */
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:28px 0 8px}
h1{font:800 clamp(34px,9vw,60px)/1.02 var(--f-disp);margin:0 0 14px;text-wrap:balance;letter-spacing:-.01em}
h2{font:800 clamp(24px,6vw,34px)/1.1 var(--f-disp);margin:0 0 8px;text-wrap:balance}
.lead{max-width:62ch;margin:0 0 20px;color:var(--ink)}
.small{font-size:14px;color:var(--ink-soft)}

/* Cuenta T */
.tacc-wrap{position:relative;margin:6px 0 22px}
.tacc{background:var(--sheet);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.tacc-name{border-bottom:2px solid var(--ink);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:52px}
.tacc-name .lbl{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.tacc-name .nm{font:800 22px/1.1 var(--f-disp)}
.redact{display:inline-block;height:22px;width:min(11em,45vw);background:var(--ink);transform:skew(-4deg)}
.grp{font:600 12px var(--f-mono);border:2px solid var(--ink);padding:1px 8px;margin-left:auto}
.cols{display:grid;grid-template-columns:1fr 1fr}
.col{padding:10px 12px 12px;min-height:128px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col+.col{border-left:2px solid var(--ink)}
.col h4{margin:0;font:700 13px var(--f-mono);letter-spacing:.16em;text-transform:uppercase}
.col.debe h4{color:var(--debe)}.col.haber h4{color:var(--haber)}
.tag{align-self:flex-start;font:600 12px var(--f-mono);border:2px solid var(--ink);padding:1px 8px;background:var(--paper)}
.tag.bal{background:var(--ink);color:var(--paper)}
.entry{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-top:1px dashed var(--ink-soft);padding-top:6px;font-size:13px;flex-wrap:wrap}
.entry b{font:600 16px var(--f-mono)}
.col.debe .entry b{color:var(--debe)}.col.haber .entry b{color:var(--haber)}
.entry.mov{animation:drop .5s ease-out}
.tacc-foot{border-top:2px solid var(--ink);padding:10px 14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.tacc-foot b{font:700 22px var(--f-mono)}
.tacc-foot span:first-child{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.stamp{position:absolute;right:10px;top:-20px;transform:rotate(-10deg);border:4px double var(--stamp);color:var(--stamp);
  font:800 clamp(22px,6vw,34px)/1 var(--f-disp);letter-spacing:.12em;padding:6px 14px;background:var(--paper);pointer-events:none;animation:thump .45s ease-out}

/* Pistas */
.slips{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.slip{background:var(--slip);color:var(--slip-ink);font-family:var(--f-type);font-size:17px;line-height:1.45;padding:12px 16px 14px;
  border:1px solid var(--slip-edge);box-shadow:2px 3px 0 rgba(0,0,0,.18);animation:pop .3s ease-out}
.slip:nth-child(even){transform:rotate(.35deg)}.slip:nth-child(odd){transform:rotate(-.3deg)}
.slip .lbl{display:block;font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.slip.hecho{background:var(--sheet);color:var(--ink);border:2px dashed var(--ink);box-shadow:none;transform:none}

/* Botones */
.btn{appearance:none;cursor:pointer;font:700 16px var(--f-body);padding:12px 20px;border:2px solid var(--ink);background:var(--sheet);color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{border-style:dashed;box-shadow:none;font-size:15px;padding:9px 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Expediente */
.sheet{background:var(--sheet);border:2px solid var(--ink);padding:4px 16px 8px;margin-bottom:16px}
.sheet h3{font:600 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:12px 0 0}
.field{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
.field:last-of-type{border-bottom:0}
.field .fl{font-weight:700;font-size:15px}
@media (max-width:540px){.field{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;cursor:pointer;font:600 15px var(--f-body);padding:8px 14px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:3px;min-height:42px}
.chip:hover:not(:disabled){background:var(--line)}
.chip.sel{background:var(--ink);color:var(--paper);box-shadow:2px 2px 0 var(--ink-soft)}
.chip.sel.debe{background:var(--debe);border-color:var(--debe);color:var(--on-color)}
.chip.sel.haber{background:var(--haber);border-color:var(--haber);color:var(--on-color)}
.chip.ok{outline:3px solid var(--ok);outline-offset:2px}
.chip.ok::after{content:" ✓";font-weight:800}
.chip.bad{outline:3px solid var(--bad);outline-offset:2px;animation:shake .35s}
.chip.bad::after{content:" ✕";font-weight:800}
.chip:disabled{cursor:default}.chip:disabled:not(.sel){opacity:.4}
.note{margin:6px 0 4px;padding:8px 12px;border-left:5px solid var(--bad);background:var(--paper);font-size:14px}
.result{border:2px solid var(--stamp);background:var(--sheet);padding:14px 16px;margin-bottom:16px}
.result b.pts{font:800 28px var(--f-mono);color:var(--stamp)}
.progress-note{font-size:14px;color:var(--ink-soft)}

/* Inicio y final */
.field-name{display:flex;flex-direction:column;gap:6px;margin:18px 0}
.field-name label{font:700 14px var(--f-body)}
.field-name input{font:600 18px var(--f-body);padding:12px 14px;border:2px solid var(--ink);background:var(--sheet);color:var(--ink);max-width:420px;width:100%}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 8px;padding:0;list-style:none}
.rules li{border-top:3px solid var(--ink);padding-top:8px;font-size:15px}
.rules li b{display:block;font:700 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.score-big{font:800 clamp(56px,16vw,96px)/1 var(--f-mono);color:var(--stamp)}
.tablewrap{overflow-x:auto;border:2px solid var(--ink);background:var(--sheet);margin:14px 0 20px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}th.n{text-align:right}
tr:last-child td{border-bottom:0}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
@keyframes thump{0%{transform:scale(2.2) rotate(-14deg);opacity:0}60%{transform:scale(.94) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-10deg)}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  'use strict';
  var TOTAL = 600;
  var GRUPOS = ['Activo', 'Pasivo', 'Patrimonio', 'Ingreso', 'Costo/Gasto'];
  var REGLAS = {
    'Activo':      { aum: 'Debe',  dis: 'Haber', saldo: 'Deudor',   estado: 'ESF' },
    'Pasivo':      { aum: 'Haber', dis: 'Debe',  saldo: 'Acreedor', estado: 'ESF' },
    'Patrimonio':  { aum: 'Haber', dis: 'Debe',  saldo: 'Acreedor', estado: 'ESF' },
    'Ingreso':     { aum: 'Haber', dis: 'Debe',  saldo: 'Acreedor', estado: 'ER' },
    'Costo/Gasto': { aum: 'Debe',  dis: 'Haber', saldo: 'Deudor',   estado: 'ER' }
  };
  var REGLA_TXT = {
    'Activo': 'Regla de los ACTIVOS: aumentan por el Debe, disminuyen por el Haber, su saldo es Deudor y se presentan en el Estado de Situación Financiera.',
    'Pasivo': 'Regla de los PASIVOS: aumentan por el Haber, disminuyen por el Debe, su saldo es Acreedor y se presentan en el Estado de Situación Financiera.',
    'Patrimonio': 'Regla del PATRIMONIO: aumenta por el Haber, disminuye por el Debe, su saldo es Acreedor y se presenta en el Estado de Situación Financiera.',
    'Ingreso': 'Regla de los INGRESOS: aumentan por el Haber, disminuyen por el Debe, su saldo es Acreedor y se presentan en el Estado de Resultados.',
    'Costo/Gasto': 'Regla de los COSTOS Y GASTOS: aumentan por el Debe, disminuyen por el Haber, su saldo es Deudor y se presentan en el Estado de Resultados.'
  };
  var CASES = [
    { nombre: 'Caja', grupo: 'Activo',
      p1: 'Billetes y monedas guardados en una cajita con llave, listos para usarse hoy mismo.',
      p2: 'Es un recurso que el negocio tiene y puede gastar al instante.' },
    { nombre: 'Bancos', grupo: 'Activo',
      p1: 'El dinero del negocio que está depositado en una cuenta del banco.',
      p2: 'Es un recurso del negocio. Cuando haces una transferencia, de aquí sale el dinero.' },
    { nombre: 'Cuentas por Pagar Proveedores', grupo: 'Pasivo',
      p1: 'Una carpeta con facturas de mercadería que tomaste a crédito y todavía no pagas.',
      p2: 'Es una deuda del negocio con terceros.' },
    { nombre: 'Sueldos por Pagar', grupo: 'Pasivo',
      p1: 'El rol de pagos ya está calculado, pero el dinero todavía no sale del banco.',
      p2: 'Es una obligación del negocio con sus empleados.' },
    { nombre: 'Capital', grupo: 'Patrimonio',
      p1: 'Lo que el dueño puso de su bolsillo para que el negocio arrancara.',
      p2: 'Pertenece a los dueños, no a los acreedores.' },
    { nombre: 'Ingresos por Servicios', grupo: 'Ingreso',
      p1: 'Lo que el negocio ha ganado este mes por cobrar sus asesorías.',
      p2: 'No es lo que tienes guardado, es lo que el negocio generó al vender su servicio.' },
    { nombre: 'Gasto Arriendo', grupo: 'Costo/Gasto',
      p1: 'Lo que cuesta cada mes usar el local donde trabajas.',
      p2: 'Es un consumo del periodo: se gasta y no queda como recurso del negocio.' },
    { nombre: 'Cuentas por Cobrar', grupo: 'Activo',
      p1: 'La libreta donde anotas lo que tus clientes te deben por ventas a crédito.',
      p2: 'Es un derecho de cobro: otros le deben dinero al negocio.' }
  ];
  var SIDE = [['Debe', 'Debe'], ['Haber', 'Haber']];
  var FIELDS = [
    { k: 'grupo',  label: 'Grupo de la cuenta', opts: GRUPOS.map(function (g) { return [g, g]; }) },
    { k: 'aum',    label: 'Aumenta con el',     opts: SIDE },
    { k: 'dis',    label: 'Disminuye con el',   opts: SIDE },
    { k: 'saldo',  label: 'Saldo normal',       opts: [['Deudor', 'Deudor'], ['Acreedor', 'Acreedor']] },
    { k: 'estado', label: 'Aparece en el',      opts: [['ESF', 'Est. de Situación Financiera'], ['ER', 'Est. de Resultados']] }
  ];
  var ALLF = FIELDS;

  var app = document.getElementById('app');
  var S = null, timerId = null, lastName = '', lastFocus = null;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { var s = Math.abs(n).toFixed(2).split('.'); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return '$' + s[0] + ',' + s[1]; }
  function mmss(t) { t = Math.max(0, t); var m = Math.floor(t / 60), s = t % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function hintCost(h) { return h === 0 ? 0 : (h === 1 ? 10 : 25); }
  function answers(c) {
    var R = REGLAS[c.grupo];
    return { grupo: c.grupo, aum: R.aum, dis: R.dis, saldo: R.saldo, estado: R.estado };
  }
  function curCase() { return CASES[S.order[S.i]]; }

  /* ---------- Pantalla de inicio ---------- */
  function renderStart() {
    clearInterval(timerId); S = null;
    app.innerHTML =
      '<div class="eyebrow">Contabilidad · Naturaleza de las cuentas · 10 minutos</div>' +
      '<h1>El caso de las cuentas misteriosas</h1>' +
      '<p class="lead">Cada expediente esconde una cuenta. Lee las pistas, completa su ficha y descubre la cuenta. Tienes 10 minutos para resolver los 8 casos.</p>' +
      '<div class="tacc-wrap"><div class="tacc"><div class="tacc-name"><span class="lbl">Cuenta</span><span class="redact"></span></div>' +
      '<div class="cols"><div class="col debe"><h4>Debe</h4><span class="tag">▲ ¿Aumenta?</span></div><div class="col haber"><h4>Haber</h4><span class="tag">▼ ¿Disminuye?</span></div></div></div></div>' +
      '<ul class="rules">' +
      '<li><b>Pistas</b>La primera es gratis. La pista 2 cuesta 10 puntos y la 3 cuesta 15 más.</li>' +
      '<li><b>Expediente</b>Elige grupo, lado donde aumenta y disminuye, saldo y estado financiero.</li>' +
      '<li><b>Sello</b>Cada caso vale 100 puntos. Cada campo mal sellado resta 6.</li></ul>' +
      '<form id="f-start"><div class="field-name"><label for="nombre">Nombre del detective</label>' +
      '<input id="nombre" type="text" autocomplete="off" maxlength="40" placeholder="Nombre y apellido" value="' + esc(lastName) + '"></div>' +
      '<button class="btn primary" type="submit">Abrir el primer caso</button></form>';
    document.getElementById('f-start').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = document.getElementById('nombre').value.trim();
      lastName = v;
      startGame(v || 'Detective anónimo');
    });
  }

  /* ---------- Juego ---------- */
  function startGame(name) {
    S = { name: name, order: shuffle([0, 1, 2, 3, 4, 5, 6, 7]), i: 0, time: TOTAL, score: 0, res: [], bonus: 0,
          picks: {}, status: {}, hints: 0, errors: 0, sealed: false, over: false, reason: '' };
    app.innerHTML =
      '<header class="hud"><div class="hud-row">' +
      '<div class="hud-cell"><span class="k">Caso</span><span class="v" id="t-case">1 de 8</span></div>' +
      '<div class="hud-cell center"><span class="k">Tiempo</span><span class="v big" id="t-time">10:00</span></div>' +
      '<div class="hud-cell right"><span class="k">Puntos</span><span class="v" id="t-score">0</span></div></div>' +
      '<div class="bar"><i id="t-bar"></i></div><div class="dots" id="dots"></div></header><main id="main"></main>';
    updateHud(); renderCase();
    clearInterval(timerId);
    timerId = setInterval(function () {
      if (!S || S.over) return;
      S.time--; updateHud();
      if (S.time <= 0) finish('tiempo');
    }, 1000);
  }

  function updateHud() {
    var t = document.getElementById('t-time'); if (!t) return;
    t.textContent = mmss(S.time);
    t.className = 'v big mono' + (S.time <= 60 ? ' low' : '');
    document.getElementById('t-bar').style.width = (S.time / TOTAL * 100) + '%';
    document.getElementById('t-score').textContent = S.score;
    document.getElementById('t-case').textContent = Math.min(S.i + 1, 8) + ' de 8';
    var d = '';
    for (var j = 0; j < 8; j++) {
      var cls = 'dot';
      if (j < S.i || (j === S.i && S.sealed)) cls += ' done'; else if (j === S.i) cls += ' cur';
      d += '<i class="' + cls + '"></i>';
    }
    document.getElementById('dots').innerHTML = d;
  }

  function chips(f) {
    return f.opts.map(function (o) {
      var v = o[0], t = o[1], sel = S.picks[f.k] === v, st = S.status[f.k], cls = ['chip'];
      if (sel) { cls.push('sel'); if (v === 'Debe') cls.push('debe'); if (v === 'Haber') cls.push('haber'); if (st) cls.push(st); }
      var dis = st === 'ok' || S.sealed;
      return '<button type="button" class="' + cls.join(' ') + '" data-k="' + f.k + '" data-v="' + v + '" aria-pressed="' + sel + '"' + (dis ? ' disabled' : '') + '>' + t + '</button>';
    }).join('');
  }
  function fieldRow(f) {
    return '<div class="field"><div class="fl">' + f.label + '</div><div class="chips">' + chips(f) + '</div></div>';
  }

  function renderCase() {
    var c = curCase(), P = S.picks;
    var slips = '<div class="slip"><span class="lbl">Pista 1 · gratis</span>' + c.p1 + '</div>';
    if (S.hints >= 1) slips += '<div class="slip"><span class="lbl">Pista 2</span>' + c.p2 + '</div>';
    if (S.hints >= 2) slips += '<div class="slip"><span class="lbl">Pista 3 · casi lo dice todo</span>' + REGLA_TXT[c.grupo] + '</div>';

    function col(side) {
      var tags = '';
      if (P.aum === side) tags += '<span class="tag">▲ Aumenta</span>';
      if (P.dis === side) tags += '<span class="tag">▼ Disminuye</span>';
      if (P.saldo && ((P.saldo === 'Deudor') === (side === 'Debe'))) tags += '<span class="tag bal">◆ Saldo</span>';
      return '<div class="col ' + (side === 'Debe' ? 'debe' : 'haber') + '"><h4>' + side + '</h4>' + tags + '</div>';
    }
    var nameHtml = S.sealed ? '<span class="nm">' + c.nombre + '</span>' : '<span class="redact"></span>';
    var grp = P.grupo ? '<span class="grp">' + P.grupo + '</span>' : '';
    var tacc = '<div class="tacc-wrap"><div class="tacc"><div class="tacc-name"><span class="lbl">Cuenta</span>' + nameHtml + grp + '</div>' +
      '<div class="cols">' + col('Debe') + col('Haber') + '</div>' +
      '</div>' + (S.sealed ? '<div class="stamp">RESUELTO</div>' : '') + '</div>';

    var notes = '';
    if (P.aum && P.dis && P.aum === P.dis) notes += '<div class="note">Una cuenta no aumenta y disminuye por el mismo lado. Revisa esos dos campos.</div>';
    if (P.aum && P.saldo && ((P.saldo === 'Deudor') !== (P.aum === 'Debe'))) notes += '<div class="note">El saldo normal queda del mismo lado donde la cuenta aumenta. Mira la cuenta T.</div>';

    var filled = ALLF.filter(function (f) { return P[f.k]; }).length;
    var anyBad = ALLF.some(function (f) { return S.status[f.k] === 'bad'; });
    var canSeal = filled === ALLF.length && !anyBad;

    var body = '<div class="slips">' + slips + '</div>';
    if (!S.sealed) {
      body += '<div class="row" style="margin-bottom:18px">' +
        (S.hints < 2 ? '<button type="button" class="btn ghost" data-act="hint">Pedir pista ' + (S.hints + 2) + ' (−' + (S.hints === 0 ? 10 : 15) + ' pts)</button>' : '<span class="progress-note">Ya usaste todas las pistas.</span>') +
        '</div>';
    }
    body += tacc;
    body += '<div class="sheet"><h3>Expediente de la cuenta</h3>' + FIELDS.map(fieldRow).join('') + '</div>';
    body += notes;

    if (S.sealed) {
      var last = S.res[S.res.length - 1];
      body += '<div class="result"><b class="pts">+' + last.pts + '</b> puntos · ' + last.hints + (last.hints === 1 ? ' pista' : ' pistas') + ' · ' + last.errors + (last.errors === 1 ? ' campo corregido' : ' campos corregidos') +
        '<div class="row" style="margin-top:12px"><button type="button" class="btn primary" data-act="next">' + (S.i >= 7 ? 'Ver informe final' : 'Siguiente caso') + '</button></div></div>';
    } else {
      body += '<div class="row"><button type="button" class="btn primary" data-act="seal"' + (canSeal ? '' : ' disabled') + '>Sellar expediente</button>' +
        '<span class="progress-note">' + (anyBad ? 'Cambia los campos marcados con ✕.' : filled + ' de ' + ALLF.length + ' campos completos') + '</span></div>';
    }
    document.getElementById('main').innerHTML = body;
    if (lastFocus) {
      var el = document.querySelector('[data-k="' + lastFocus.k + '"][data-v="' + lastFocus.v + '"]');
      if (el && !el.disabled) el.focus({ preventScroll: true });
      lastFocus = null;
    }
  }

  function pick(k, v) {
    if (!S || S.over || S.sealed || S.status[k] === 'ok') return;
    S.picks[k] = v; delete S.status[k];
    lastFocus = { k: k, v: v };
    renderCase();
  }

  function seal() {
    var c = curCase(), A = answers(c), wrong = 0;
    ALLF.forEach(function (f) {
      if (S.status[f.k] === 'ok') return;
      if (S.picks[f.k] === A[f.k]) S.status[f.k] = 'ok'; else { S.status[f.k] = 'bad'; wrong++; }
    });
    if (wrong === 0) {
      var pts = Math.max(20, 100 - hintCost(S.hints) - 6 * S.errors);
      S.res.push({ nombre: c.nombre, hints: S.hints, errors: S.errors, pts: pts });
      S.score += pts; S.sealed = true;
      updateHud();
    } else {
      S.errors += wrong;
    }
    renderCase();
  }

  function next() {
    if (S.i >= 7) { finish('completo'); return; }
    S.i++; S.picks = {}; S.status = {}; S.hints = 0; S.errors = 0; S.sealed = false;
    updateHud(); renderCase(); window.scrollTo(0, 0);
  }

  function finish(reason) {
    if (S.over) return;
    S.over = true; S.reason = reason; clearInterval(timerId);
    if (S.res.length === 8) { S.bonus = Math.floor(S.time / 5); S.score += S.bonus; }
    var sc = S.score, rank, msg;
    if (sc >= 700)      { rank = 'Jefe/a de Detectives'; msg = 'Dominas la naturaleza de las cuentas. Casi no necesitaste pistas.'; }
    else if (sc >= 500) { rank = 'Inspector/a';          msg = 'Muy buen trabajo. Repasa los casos donde pediste pista o corregiste campos.'; }
    else if (sc >= 300) { rank = 'Detective';            msg = 'Vas bien. Vuelve a mirar la regla de cada grupo y juega otra vez.'; }
    else                { rank = 'Aprendiz de detective'; msg = 'Buen comienzo. Repasa la tabla de Activos, Pasivos, Patrimonio, Ingresos y Gastos, y reintenta.'; }
    var rows = S.res.map(function (r) { return '<tr><td>' + r.nombre + '</td><td class="n">' + r.hints + '</td><td class="n">' + r.errors + '</td><td class="n">' + r.pts + '</td></tr>'; }).join('');
    if (S.bonus) rows += '<tr><td>Bono por tiempo restante</td><td></td><td></td><td class="n">' + S.bonus + '</td></tr>';
    app.innerHTML =
      '<header class="hud"><div class="hud-row"><div class="hud-cell"><span class="k">Informe</span><span class="v">Final</span></div>' +
      '<div class="hud-cell center"><span class="k">Tiempo usado</span><span class="v mono">' + mmss(TOTAL - S.time) + '</span></div>' +
      '<div class="hud-cell right"><span class="k">Casos</span><span class="v mono">' + S.res.length + '/8</span></div></div></header>' +
      '<div class="eyebrow">' + (S.reason === 'tiempo' ? 'Se acabó el tiempo' : 'Todos los casos sellados') + '</div>' +
      '<h2>' + esc(S.name) + '</h2>' +
      '<div class="score-big">' + sc + '</div><p class="small" style="margin:0 0 4px">puntos</p>' +
      '<h2 style="margin-top:16px">' + rank + '</h2><p class="lead">' + msg + '</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Cuenta resuelta</th><th class="n">Pistas</th><th class="n">Errores</th><th class="n">Puntos</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="4">Aún no se selló ningún caso.</td></tr>') + '</tbody></table></div>' +
      '<p class="small">Muestra esta pantalla a tu docente antes de cerrarla.</p>' +
      '<div class="row"><button type="button" class="btn primary" data-act="again">Jugar de nuevo</button></div>';
    window.scrollTo(0, 0);
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.k) { pick(b.dataset.k, b.dataset.v); return; }
    var a = b.dataset.act;
    if (a === 'hint' && S && !S.sealed && S.hints < 2) { S.hints++; renderCase(); }
    else if (a === 'seal') seal();
    else if (a === 'next') next();
    else if (a === 'again') renderStart();
  });

  renderStart();
})();
</script>

</body></html>
